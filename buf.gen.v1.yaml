#
# buf generate configuration for the A2A v1.0.0 SlimRPC bindings.
#
# Produces two artefacts per proto under src/types/v1/:
#   * <base>_pb.ts       — protobuf-es v2 message types + schemas (remote bufbuild/es)
#   * <base>_slimrpc.ts  — slimrpc client/group/servicer/register stubs (local plugin)
---
#
# NOTE: `npm run generate` passes `--include-imports` so protobuf-es code is
# emitted for the A2A proto's google/api/* imports (annotations, client,
# field_behavior); google/protobuf/* well-known types are mapped to
# @bufbuild/protobuf/wkt instead.
version: v2
clean: false
managed:
  enabled: true
inputs:
  - git_repo: https://github.com/a2aproject/A2A.git
    ref: v1.0.0
    subdir: specification
plugins:
  # Generates <base>_slimrpc.ts (client stub, group stub, servicer interface,
  # handler adapters, and registration function).
  # Requires `protoc-gen-slimrpc-node` on PATH:
  #   cargo install --locked agntcy-protoc-slimrpc-plugin --bin protoc-gen-slimrpc-node
  - local: protoc-gen-slimrpc-node
    out: src/types/v1
    # bindings_import defaults to "@agntcy/slim-bindings" — the linked local
    # build exposes the required named exports, so no override is needed.
  # Generates <base>_pb.ts (protobuf-es v2 message types + schemas).
  - remote: buf.build/bufbuild/es:v2.12.1
    out: src/types/v1
    opt:
      - target=ts
      - import_extension=js
